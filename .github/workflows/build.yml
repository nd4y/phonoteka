name: Test and build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phonoteka-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    outputs:
      image_id: ${{ steps.candidate.outputs.image_id }}
      image_digest: ${{ steps.candidate.outputs.image_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install media codecs
        # Hosted Ubuntu mirrors occasionally take more than five minutes for
        # ffmpeg's dependency set; all media and tracing gates remain required.
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg libebur128-1 libchromaprint-tools
      - name: Backend tests with actual media codecs
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -c requirements.lock '.[test]'
          PYTHONPATH=backend .venv/bin/python tests/tracing_budget.py --smoke
          .venv/bin/python -m pytest -q
      - name: Frontend tests and production build
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Container build
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t phonoteka:ci .
      - name: Container smoke and isolation
        run: python3 tests/container_smoke.py
      - name: Native tracing infrastructure configuration
        run: python3 tests/tracing_infrastructure.py
      - name: Generated tracing workload, resource budget and ten-minute receiver outage
        run: |
          cpuset="$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')"
          docker run --rm --user 0:0 --memory=768m --memory-swap=768m --cpuset-cpus="$cpuset" \
            --volume "$PWD/tests:/tests:ro" --volume "$RUNNER_TEMP:/out" \
            --entrypoint python phonoteka:ci /tests/tracing_budget.py \
            --output /out/tracing-budget.json --outage-seconds 600
      - name: Record generated tracing acceptance evidence
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tracing-budget.json" ]; then
            cat "$RUNNER_TEMP/tracing-budget.json"
            printf '\n### Generated tracing budget\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/tracing-budget.json" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Push exact tested image candidate
        if: github.event_name != 'pull_request'
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="$image:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image_id="$(docker inspect phonoteka:ci --format '{{.Id}}')"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(docker inspect phonoteka:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$GITHUB_SHA" ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag phonoteka:ci "$candidate"
          docker push "$candidate"
          digest_ref=''
          while IFS= read -r reference; do
            if [[ "$reference" == "$image@sha256:"* ]]; then digest_ref="$reference"; break; fi
          done < <(docker inspect "$candidate" --format '{{range .RepoDigests}}{{println .}}{{end}}')
          [[ "${digest_ref#"$image@"}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$digest_ref" == "$image@sha256:"* ]]
          printf 'image_id=%s\nimage_digest=%s\n' "$image_id" "$digest_ref" >> "$GITHUB_OUTPUT"
          printf 'Tested app: `%s`\nConfig image ID: `%s`\n' "$digest_ref" "$image_id" >> "$GITHUB_STEP_SUMMARY"
  inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image_id: ${{ steps.candidate.outputs.image_id }}
      image_digest: ${{ steps.candidate.outputs.image_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build pinned CPU inference image
        run: |
          docker build -f Dockerfile.inference --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t phonoteka-inference:ci .
      - name: Real ASR and job deduplication
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak
          python3 tests/inference_smoke.py
      - name: Push exact tested inference candidate
        if: github.event_name != 'pull_request'
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}-inference"
          candidate="$image:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image_id="$(docker inspect phonoteka-inference:ci --format '{{.Id}}')"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(docker inspect phonoteka-inference:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$GITHUB_SHA" ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag phonoteka-inference:ci "$candidate"
          docker push "$candidate"
          digest_ref=''
          while IFS= read -r reference; do
            if [[ "$reference" == "$image@sha256:"* ]]; then digest_ref="$reference"; break; fi
          done < <(docker inspect "$candidate" --format '{{range .RepoDigests}}{{println .}}{{end}}')
          [[ "${digest_ref#"$image@"}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$digest_ref" == "$image@sha256:"* ]]
          printf 'image_id=%s\nimage_digest=%s\n' "$image_id" "$digest_ref" >> "$GITHUB_OUTPUT"
          printf 'Tested inference: `%s`\nConfig image ID: `%s`\n' "$digest_ref" "$image_id" >> "$GITHUB_STEP_SUMMARY"
  inference-acceptance:
    needs: [verify, inference]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Pull the exact tested candidate pair
        env:
          GH_TOKEN: ${{ github.token }}
          APP_REF: ${{ needs.verify.outputs.image_digest }}
          APP_ID: ${{ needs.verify.outputs.image_id }}
          INFERENCE_REF: ${{ needs.inference.outputs.image_digest }}
          INFERENCE_ID: ${{ needs.inference.outputs.image_id }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$APP_REF" == "$image@sha256:"* && "${APP_REF#"$image@"}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$INFERENCE_REF" == "$image-inference@sha256:"* && "${INFERENCE_REF#"$image-inference@"}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$APP_ID" =~ ^sha256:[0-9a-f]{64}$ && "$INFERENCE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$APP_REF"
          docker pull "$INFERENCE_REF"
          [[ "$(docker inspect "$APP_REF" --format '{{.Id}}')" == "$APP_ID" ]]
          [[ "$(docker inspect "$INFERENCE_REF" --format '{{.Id}}')" == "$INFERENCE_ID" ]]
      - name: Real ASR, bounded model recovery and concurrent ordinary work
        env:
          APP_ID: ${{ needs.verify.outputs.image_id }}
          INFERENCE_ID: ${{ needs.inference.outputs.image_id }}
        run: |
          python3 tests/inference_acceptance.py --revision "$GITHUB_SHA" \
            --app-image "$APP_ID" --inference-image "$INFERENCE_ID" \
            --output "$RUNNER_TEMP/phonoteka-asr19"
      - name: Preserve generated acceptance evidence on success or failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/phonoteka-asr19/result.json" ]]; then
            echo 'No generated acceptance report: the profile did not reach its reporting stage.'
            exit 0
          fi
          archive="$RUNNER_TEMP/generated-acceptance.tar.gz"
          python3 tests/package_acceptance_reports.py "$RUNNER_TEMP/phonoteka-asr19" "$archive"
          tag="acceptance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" "$archive" "$archive.sha256" --draft --target "$GITHUB_SHA" \
            --title "Generated ASR acceptance $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --notes 'Generated test data and resource measurements only. Profile outcome is recorded in result.json; this draft is not deployment admission.'
  publish:
    needs: [verify, inference, inference-acceptance]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Verify, promote and package exact tested images
        env:
          GH_TOKEN: ${{ github.token }}
          APP_DIGEST: ${{ needs.verify.outputs.image_digest }}
          APP_IMAGE_ID: ${{ needs.verify.outputs.image_id }}
          INFERENCE_DIGEST: ${{ needs.inference.outputs.image_digest }}
          INFERENCE_IMAGE_ID: ${{ needs.inference.outputs.image_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          inference_image="$image-inference"
          [[ "$APP_DIGEST" == "$image@sha256:"* && "${APP_DIGEST#"$image@"}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$INFERENCE_DIGEST" == "$inference_image@sha256:"* && "${INFERENCE_DIGEST#"$inference_image@"}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$APP_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ && "$INFERENCE_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$APP_DIGEST"
          docker pull "$INFERENCE_DIGEST"
          [[ "$(docker inspect "$APP_DIGEST" --format '{{.Id}}')" == "$APP_IMAGE_ID" ]]
          [[ "$(docker inspect "$INFERENCE_DIGEST" --format '{{.Id}}')" == "$INFERENCE_IMAGE_ID" ]]
          [[ "$(docker inspect "$APP_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$GITHUB_SHA" ]]
          [[ "$(docker inspect "$INFERENCE_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$GITHUB_SHA" ]]
          docker tag "$APP_DIGEST" "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          docker tag "$INFERENCE_DIGEST" "$inference_image:sha-$GITHUB_SHA"
          docker push "$inference_image:sha-$GITHUB_SHA"
          docker tag "$APP_DIGEST" phonoteka:ci
          docker tag "$INFERENCE_DIGEST" phonoteka-inference:ci
          docker save phonoteka:ci | gzip > phonoteka-image.tar.gz
          sha256sum phonoteka-image.tar.gz > phonoteka-image.sha256
          printf '%s\n' "$APP_IMAGE_ID" > image-id.txt
          printf '%s\n' "$GITHUB_SHA" > revision.txt
          docker save phonoteka-inference:ci | gzip > inference-image.tar.gz
          sha256sum inference-image.tar.gz > inference-image.sha256
          printf '%s\n' "$INFERENCE_IMAGE_ID" > inference-image-id.txt
          printf '%s\n' "$GITHUB_SHA" > inference-revision.txt
          assets=(phonoteka-image.tar.gz phonoteka-image.sha256 image-id.txt revision.txt inference-image.tar.gz inference-image.sha256 inference-image-id.txt inference-revision.txt)
          for asset in "${assets[@]}"; do
            size="$(stat -c %s "$asset")"
            (( size > 0 && size < 2000000000 ))
          done
          release_tag="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'Internal CI delivery candidate. Draft only; not a published release.\n\nSource: %s\nWorkflow run: https://github.com/%s/actions/runs/%s/attempts/%s\nApp: %s\nApp config ID: %s\nInference: %s\nInference config ID: %s\n\nBoth exact images passed their build and smoke jobs. The eight assets contain those pulled images and their checksums, config IDs and source revision.\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$APP_DIGEST" "$APP_IMAGE_ID" "$INFERENCE_DIGEST" "$INFERENCE_IMAGE_ID" > delivery-notes.md
          gh release create "$release_tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease --title "CI delivery $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT" \
            --notes-file delivery-notes.md "${assets[@]}"
          cat delivery-notes.md >> "$GITHUB_STEP_SUMMARY"
