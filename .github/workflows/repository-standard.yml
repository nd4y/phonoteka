name: Repository standard

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-standard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    name: repository-standard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Install pinned checker dependencies
        run: npm ci --prefix .standards --ignore-scripts --no-audit --no-fund
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          if ! node .standards/install-gitleaks.mjs; then
            # Keep the toolkit's pinned binary/checksum; only the transport differs.
            test "$(uname -m)" = x86_64
            archive="$(mktemp "$RUNNER_TEMP/gitleaks.XXXXXXXX.tar.gz")"
            trap 'rm -f -- "$archive"' EXIT
            curl --fail --location --retry 2 --retry-delay 3 --connect-timeout 10 --max-time 90 \
              --output "$archive" \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
            echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
            mkdir -p .standards/bin
            tar -xzf "$archive" -C .standards/bin gitleaks
            chmod 755 .standards/bin/gitleaks
            .standards/bin/gitleaks version
          fi
      - name: Check complete proposed change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-list --max-parents=0 "$HEAD" | tail -n 1)"
          fi
          node .standards/check.mjs ci "$BASE" "$HEAD"
