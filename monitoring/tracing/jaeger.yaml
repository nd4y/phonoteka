extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_storage:
    backends:
      traces:
        badger:
          directories:
            keys: /data/keys
            values: /data/values
          ephemeral: false
          ttl:
            spans: 168h
  jaeger_query:
    storage:
      traces: traces
    http:
      endpoint: 0.0.0.0:16686
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1152
    spike_limit_mib: 256
  batch:
    send_batch_size: 128
    send_batch_max_size: 128
    timeout: 1s
exporters:
  jaeger_storage_exporter:
    trace_storage: traces
service:
  extensions: [healthcheckv2, jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: warn
