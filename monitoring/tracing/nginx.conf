worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_conn_zone $server_name zone=ingest:1m;
  server {
    listen 4318 ssl;
    server_name otlp.phonoteka.internal;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/secrets/server.crt;
    ssl_certificate_key /run/secrets/server.key;
    ssl_client_certificate /run/secrets/ca.pem;
    ssl_verify_client on;
    client_max_body_size 512k;
    client_body_timeout 3s;
    client_header_timeout 3s;
    keepalive_timeout 10s;
    limit_conn ingest 8;
    location = /v1/traces {
      limit_except POST { deny all; }
      if ($http_content_encoding != "") { return 415; }
      proxy_pass http://collector:4318/v1/traces;
      proxy_connect_timeout 1s;
      proxy_read_timeout 3s;
      proxy_send_timeout 3s;
      proxy_request_buffering on;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Host collector;
    }
    location / { return 404; }
  }
}
