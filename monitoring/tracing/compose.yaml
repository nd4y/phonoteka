# Deploy through Portainer. TRACE_ROOT contains only trace data and dedicated secrets.
services:
  ingest:
    image: nginx@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    container_name: phonoteka-otlp-ingest
    user: "1026:100"
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    mem_limit: 64m
    cpu_shares: 128
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - ${TRACE_ROOT}/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TRACE_ROOT}/secrets/server.crt:/run/secrets/server.crt:ro
      - ${TRACE_ROOT}/secrets/server.key:/run/secrets/server.key:ro
      - ${TRACE_ROOT}/secrets/ca.pem:/run/secrets/ca.pem:ro
    networks:
      ingest:
        aliases: [otlp.phonoteka.internal]
      pipeline: {}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
  collector:
    image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    container_name: phonoteka-otel-collector
    command: [--config=/etc/otelcol/config.yaml]
    user: "1026:100"
    restart: unless-stopped
    mem_limit: 512m
    cpu_shares: 128
    read_only: true
    volumes:
      - ${TRACE_ROOT}/config/collector.yaml:/etc/otelcol/config.yaml:ro
      - ${TRACE_ROOT}/secrets/otlp_token:/run/secrets/otlp_token:ro
      - ${TRACE_ROOT}/queue:/queue
    networks: [pipeline]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
  jaeger:
    # 2.21+ removed search APIs used by Grafana 13.1's built-in Jaeger source.
    image: jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    container_name: phonoteka-jaeger
    command: [--config=/etc/jaeger/config.yaml]
    user: "1026:100"
    restart: unless-stopped
    mem_limit: 1536m
    cpu_shares: 128
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    volumes:
      - ${TRACE_ROOT}/config/jaeger.yaml:/etc/jaeger/config.yaml:ro
      - ${TRACE_ROOT}/jaeger-v220:/data
    networks: [pipeline, bridge]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
networks:
  ingest:
    name: phonoteka_trace_ingest
    internal: true
  pipeline:
    internal: true
  bridge:
    external: true
    name: bridge_default
