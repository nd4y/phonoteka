# Optional overlay: docker compose -f compose.yaml -f compose.pc2-asr.yaml up -d
# Existing independent ASR engine only; no Phonoteka sources go to the GPU host.
services:
  inference:
    environment:
      ASR_BACKEND: pc2
      ASR_MODEL: faster-whisper-large-v3
      PC2_ASR_URL: ${PC2_ASR_URL:?Set the authenticated HTTPS engine URL ending in /v1/whisper}
      PC2_ASR_SECRET_FILE: /run/secrets/pc2_asr_key
    volumes:
      - type: bind
        source: ${PC2_ASR_KEY_FILE:?Set an existing protected engine key file}
        target: /run/secrets/pc2_asr_key
        read_only: true
        bind: {create_host_path: false}
